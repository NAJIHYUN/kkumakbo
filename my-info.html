<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>나의 정보</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👤</text></svg>">
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./styles.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="./supabase-config.js?v=20260324-2"></script>
  <script defer src="./supabase-client.js?v=20260324-2"></script>
  <script defer src="./account.js?v=20261120-1"></script>
  <script defer src="./my-info.js?v=20261120-1"></script>
  <script defer src="./nav.js?v=20261120-1"></script>
  <link rel="stylesheet" href="./apple.css?v=20261120-2" />
</head>
<body data-my-info="1">
  <header class="topbar">
    <div class="brand">
      <strong id="myInfoPageTitle">나의 정보</strong>
    </div>
    <nav class="app-nav" aria-label="주요 메뉴">
      <a class="app-nav-item" href="./index.html" data-nav="index">홈</a>
      <a class="app-nav-item" href="./favorite.html" data-nav="favorite">즐겨찾기</a>
      <a class="app-nav-item hidden" href="./review.html" data-nav="review" data-admin-only>승인 대기<span class="app-nav-count hidden" data-pending-count></span></a>
      <a class="app-nav-item" href="./my-info.html" data-nav="my-info">MY</a>
    </nav>
  </header>

  <main class="container">
    <div class="myinfo-profile-summary">
      <div class="myinfo-avatar-wrap">
        <button id="myInfoAvatarButton" class="myinfo-avatar" type="button" aria-label="프로필 사진 변경">🐶</button>
        <input id="myInfoAvatarInput" class="hidden" type="file" accept="image/*" />
      </div>
      <strong id="myInfoSummaryNickname" class="myinfo-summary-nickname">-</strong>
      <div id="myInfoSummaryEmail" class="myinfo-summary-email">-</div>
    </div>
    <section class="myinfo-page-card">
      <div class="package-form myinfo-form">
        <label id="myInfoLinePassword" class="package-name-line" for="myInfoNewPassword">
          <span>새 비밀번호</span>
          <input id="myInfoNewPassword" class="input package-name-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="new-password" placeholder="숫자 6자리" />
        </label>
        <label id="myInfoLinePasswordConfirm" class="package-name-line" for="myInfoNewPasswordConfirm">
          <span>비밀번호 확인</span>
          <input id="myInfoNewPasswordConfirm" class="input package-name-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="new-password" placeholder="한 번 더" />
        </label>
        <div class="myinfo-actions">
          <button id="btnThemeToggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="다크 모드 전환">
            <span class="theme-toggle-track" aria-hidden="true">
              <span class="theme-toggle-thumb"></span>
            </span>
            <span id="themeToggleLabel" class="theme-toggle-label">라이트</span>
          </button>
          <button id="btnMyInfoLogout" class="btn" type="button">로그아웃</button>
          <button id="btnMyInfoChangePassword" class="btn" type="button">비밀번호 변경</button>
        </div>
        <div id="myInfoStatus" class="myinfo-status"></div>
      </div>
    </section>
    <a class="myinfo-admin-link hidden" href="./review.html" data-admin-only>
      <span>악보 승인 대기</span>
      <span class="app-nav-count hidden" data-pending-count></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </a>
    <section id="myInfoPackagesSection" class="myinfo-packages-section">
      <strong id="myInfoPackagesTitle" class="myinfo-packages-title">나의 악보</strong>
      <div class="vault-search-wrap">
        <input id="myPackagesSearch" class="input" type="text" placeholder="검색 (예: 악보명 / 찬양팀 / 키 / 초성)" />
        <button id="btnClearMyPackagesSearch" class="vault-search-clear hidden" type="button" aria-label="검색어 전체 삭제">×</button>
      </div>
      <div id="myPackagesList" class="vault-list"></div>
    </section>
  </main>

  <section class="guest-page-card">
    <div id="myInfoGuestActions" class="myinfo-guest-actions hidden">
      <p class="myinfo-guest-copy">즐겨찾기는 로그인 후 사용할 수 있어요.</p>
      <div class="myinfo-guest-buttons">
        <button id="btnMyInfoGuestLogin" class="btn primary" type="button">로그인</button>
        <button id="btnMyInfoGuestSignup" class="btn" type="button">회원가입</button>
      </div>
    </div>
  </section>

  <div id="myInfoAvatarCropModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="myInfoAvatarCropTitle">
    <div class="modal-backdrop" data-avatar-crop-close="1"></div>
    <div class="modal-card myinfo-avatar-crop-card">
      <div class="modal-head">
        <strong id="myInfoAvatarCropTitle" class="m-title">프로필 사진</strong>
        <button class="btn" type="button" data-avatar-crop-close="1">닫기</button>
      </div>
      <div class="modal-body myinfo-avatar-crop-body">
        <div id="myInfoAvatarCropStage" class="myinfo-avatar-crop-stage">
          <img id="myInfoAvatarCropImage" class="myinfo-avatar-crop-image hidden" alt="" />
          <div class="myinfo-avatar-crop-ring" aria-hidden="true"></div>
        </div>
        <p class="myinfo-avatar-crop-help">사진을 드래그해서 위치를 맞출 수 있어요.</p>
      </div>
      <div class="modal-foot">
        <button id="myInfoAvatarCropCancel" class="btn" type="button" data-avatar-crop-close="1">취소</button>
        <button id="myInfoAvatarCropSave" class="btn primary" type="button">저장</button>
      </div>
    </div>
  </div>
</body>
</html>
