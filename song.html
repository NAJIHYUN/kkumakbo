<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>악보 · 꿈꾸는교회 악보함</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
  <script src="./theme.js?v=20261120-1"></script>
  <link rel="stylesheet" href="./styles.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="./supabase-config.js?v=20260324-1"></script>
  <script defer src="./supabase-client.js?v=20260324-1"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script defer src="./app.js?v=20261120-1"></script>
  <script defer src="./nav.js?v=20261120-1"></script>
  <link rel="stylesheet" href="./apple.css?v=20261120-6" />
</head>
<body class="song-page" data-page="song">
  <!-- Preview Modal -->
  <div id="modal" class="modal song-view hidden">
    <div class="modal-backdrop" data-close="1"></div>
    <div class="modal-card">
      <div class="modal-head">
        <button class="btn song-back" type="button" data-close="1" aria-label="악보 목록으로">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"></path></svg>
        </button>
        <div class="song-head-text">
          <h1 id="mTitle" class="m-title"></h1>
          <div id="mMeta" class="m-meta"></div>
        </div>
      </div>
      <div class="modal-body">
        <button id="mPrevPage" class="preview-nav preview-nav-prev hidden" type="button" aria-label="이전 페이지">‹</button>
        <button id="mNextPage" class="preview-nav preview-nav-next hidden" type="button" aria-label="다음 페이지">›</button>
        <div id="mEditPanel" class="preview-edit-panel hidden">
          <div class="preview-edit-grid">
            <label class="add-label">
              <span>악보명</span>
              <input id="mEditTitle" class="input" type="text" />
            </label>
            <label class="add-label">
              <span>아티스트</span>
              <div class="artist-autocomplete">
                <input id="mEditArtist" class="input" type="text" autocomplete="off" />
                <div id="mEditArtistSuggest" class="artist-suggest hidden" role="listbox" aria-label="아티스트 추천"></div>
              </div>
            </label>
            <label class="add-label">
              <span>Key</span>
              <select id="mEditKey" class="select">
                <option value="">선택</option>
                <option value="C">C</option>
                <option value="Db">Db</option>
                <option value="D">D</option>
                <option value="Eb">Eb</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="F#">F#</option>
                <option value="G">G</option>
                <option value="Ab">Ab</option>
                <option value="A">A</option>
                <option value="Bb">Bb</option>
                <option value="B">B</option>
              </select>
            </label>
            <label class="add-label">
              <span>페이지 추가 (PDF/JPG, 다중 가능)</span>
              <input id="mEditAddPages" class="input" type="file" accept="application/pdf,image/*" multiple />
            </label>
          </div>
          <div class="preview-edit-actions">
            <button id="mEditCancel" class="btn" type="button">수정 취소</button>
            <button id="mEditApply" class="btn primary" type="button">적용 저장</button>
          </div>
        </div>
        <img id="mImg" class="preview-img hidden" alt="미리보기" />
        <div id="mPdfMainWrap" class="pdf-main-wrap hidden">
          <canvas id="mPdfMain" class="pdf-main-canvas" aria-label="PDF 1페이지 미리보기"></canvas>
        </div>
        <div id="mPageStrip" class="page-strip hidden" aria-label="페이지 목록"></div>
      </div>
      <div class="modal-foot song-toolbar">
        <div class="action-menu">
          <button class="btn action-trigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menuShare">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="M8 7l4-4 4 4"></path><path d="M7 10H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1"></path></svg>
            <span>공유</span>
          </button>
          <div id="menuShare" class="action-popover hidden" role="menu" aria-label="공유">
            <button id="mCopyLink" class="action-item" type="button" role="menuitem">링크</button>
            <button id="mShareImage" class="action-item" type="button" role="menuitem">이미지</button>
            <button id="mSharePdf" class="action-item" type="button" role="menuitem">PDF</button>
          </div>
        </div>
        <div class="action-menu">
          <button class="btn action-trigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menuSave">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"></path><path d="M8 11l4 4 4-4"></path><path d="M5 19h14"></path></svg>
            <span>저장</span>
          </button>
          <div id="menuSave" class="action-popover hidden" role="menu" aria-label="저장">
            <button id="mSaveImage" class="action-item" type="button" role="menuitem">이미지</button>
            <a id="mDownload" class="action-item" role="menuitem" download>PDF</a>
          </div>
        </div>
        <button id="mEditSong" class="btn" type="button">악보 수정</button>
      </div>
    </div>
  </div>

  <main id="songEmpty" class="song-empty hidden">
    <p class="song-empty-title">악보를 찾을 수 없어요</p>
    <p class="song-empty-copy">링크가 잘못됐거나, 아직 승인되지 않은 악보예요.</p>
    <a class="btn primary" href="./index.html">악보 목록으로</a>
  </main>
</body>
</html>
