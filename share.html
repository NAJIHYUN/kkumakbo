  <script defer src="./share.js?v=20260324-1"></script>

  <link rel="stylesheet" href="./apple.css?v=20261121-4" />

<body data-share="1">
  <header class="topbar">
    <div class="brand">
      <strong id="packageTitle">악보 콘티</strong>
      <span id="packageNamePreview" class="sub">공유된 악보 리스트</span>
    </div>
      <nav class="app-nav" aria-label="주요 메뉴">
      <a class="app-nav-item" href="./index.html" data-nav="index">홈</a>
      <a class="app-nav-item" href="./favorite.html" data-nav="favorite">즐겨찾기</a>
      <a class="app-nav-item" href="./add.html" data-nav="add">악보 추가</a>
      <a class="app-nav-item hidden" href="./review.html" data-nav="review" data-admin-only>승인 대기<span class="app-nav-count hidden" data-pending-count></span></a>
      <a class="app-nav-item" href="./my-info.html" data-nav="my-info">MY</a>
    </nav>
  </header>

  <main class="container">
    <section class="share-card">
      <h2 class="h2">콘티</h2>
      <div id="packageMemo" class="share-note hidden"></div>
      <h2 id="downloadSummary" class="h2"></h2>
    </section>

    <section class="share-card">
      <h2 class="h2">악보 공유하기</h2>
      <div class="row download-actions">
        <button id="btnDownloadAll" class="btn primary">전체 PDF</button>
        <button id="btnPickSheets" class="btn">개별 페이지 선택</button>
        <button id="btnDownloadPicked" class="btn primary hidden">선택한 페이지 PDF 공유</button>
        <button id="btnSharePackageLink" class="btn">이 페이지 공유하기</button>
      </div>
    </section>

    <section class="share-card">
      <h2 class="h2">공유된 악보</h2>
      <div id="shareSheets" class="sheet-list"></div>
    </section>
  </main>
