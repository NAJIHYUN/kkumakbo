<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>로그인 · 꿈꾸는교회 악보함</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
  <script src="./theme.js?v=20261120-1"></script>
  <link rel="stylesheet" href="./styles.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="./supabase-config.js"></script>
  <script defer src="./supabase-client.js"></script>
  <script defer src="./account.js?v=20261120-1"></script>
  <script defer src="./auth.js?v=20261120-1"></script>
  <link rel="stylesheet" href="./apple.css?v=20261121-1" />
</head>
<body class="auth-page pin-auth-page">
  <main class="pin-auth">
    <header class="pin-auth-head">
      <button id="btnAuthBack" class="pin-back" type="button" aria-label="뒤로">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"></path></svg>
      </button>
      <span class="pin-brand"><span class="auth-brand-kkum">kkum</span><span class="auth-brand-akbo">akbo</span></span>
    </header>

    <section class="pin-auth-body">
      <h1 id="authTitle" class="pin-title">로그인</h1>
      <p id="authDesc" class="pin-desc">닉네임을 입력해 주세요.</p>

      <!-- 1단계: 닉네임 -->
      <form id="stepNickname" class="pin-step" autocomplete="on" novalidate>
        <input id="authNickname" class="input pin-nickname" type="text" name="username" autocomplete="username"
               maxlength="10" placeholder="닉네임 (10자 이내)" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next" />
        <p id="nicknameStatus" class="pin-status" role="status" aria-live="polite"></p>
        <button id="btnNicknameNext" class="btn primary pin-next" type="submit">다음</button>
      </form>

      <!-- 2단계: 숫자 6자리 -->
      <div id="stepPin" class="pin-step hidden">
        <div id="pinDots" class="pin-dots" role="img" aria-label="비밀번호 0자리 입력됨">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <p id="authStatus" class="pin-status" role="status" aria-live="polite"></p>
        <div class="pin-keypad" aria-label="숫자 키패드">
          <button type="button" data-key="1">1</button>
          <button type="button" data-key="2">2</button>
          <button type="button" data-key="3">3</button>
          <button type="button" data-key="4">4</button>
          <button type="button" data-key="5">5</button>
          <button type="button" data-key="6">6</button>
          <button type="button" data-key="7">7</button>
          <button type="button" data-key="8">8</button>
          <button type="button" data-key="9">9</button>
          <span aria-hidden="true"></span>
          <button type="button" data-key="0">0</button>
          <button type="button" data-key="back" aria-label="지우기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h10a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 18H9l-5.5-6Z"></path><path d="m11.5 9.5 5 5m0-5-5 5"></path></svg>
          </button>
        </div>
      </div>

      <!-- 가입 완료 안내 -->
      <div id="stepDone" class="pin-step hidden">
        <p id="authNotice" class="pin-notice" role="status"></p>
        <a class="btn primary pin-next" href="./index.html">악보 보러 가기</a>
      </div>
    </section>

    <footer class="pin-auth-foot">
      <button id="btnSwitchMode" class="pin-switch" type="button">처음이신가요? <strong>회원가입</strong></button>
      <details class="auth-contact-accordion">
        <summary class="auth-contact-title">관리자 문의 (비밀번호를 잊었어요)</summary>
        <div class="auth-contact-body">
          <textarea id="contactMessage" class="auth-contact-textarea" rows="3" placeholder="닉네임과 문의 내용을 적어주세요."></textarea>
          <button id="btnContactAdmin" class="btn auth-contact-btn" type="button">문의하기</button>
          <p id="contactStatus" class="pin-contact-status" role="status"></p>
        </div>
      </details>
    </footer>
  </main>
</body>
</html>
